# A TOML plugin for proto:
# https://moonrepo.dev/docs/proto/plugins#toml-plugin

name = "evervault"
type = "cli"

[resolve]
git-url = "https://github.com/evervault/evervault-cli"
version-pattern = "^v((?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+))$"

[platform.linux]
download-file = "{arch}-unknown-linux-musl/ev.tar.gz"

[platform.macos]
download-file = "{arch}-apple-darwin/ev.tar.gz"

[install]
download-url = "https://cli.evervault.com/4/{version}/{download_file}"

[install.arch]
aarch64 = "aarch64"
x86_64 = "x86_64"

[install.exes.ev]
exe-path = "bin/ev"
primary = true
